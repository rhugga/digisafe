name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # gofmt and vet for every target platform, once.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "not gofmt'd:"; echo "$out"; exit 1; fi
      - name: vet (linux, macOS, windows)
        run: |
          GOOS=linux   go vet ./...
          GOOS=darwin  go vet ./...
          GOOS=windows go vet ./...

  # The tests on each platform, so the Windows code (LockFileEx, the clipboard and paths) runs
  # for real, not just compiles.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: test
        if: runner.os != 'Windows'
        run: go test -race -count=1 ./...
      # the race detector needs cgo and a C toolchain on Windows; run the tests without it there
      - name: test (windows)
        if: runner.os == 'Windows'
        run: go test -count=1 ./...
      - name: build
        run: go build -trimpath -o ${{ runner.temp }}/digisafe${{ runner.os == 'Windows' && '.exe' || '' }} .
